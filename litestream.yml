# Litestream config — SQLite alba.db → Cloudflare R2 (S3 호환) 실시간 복제
# 환경변수: R2_ENDPOINT, R2_BUCKET, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
# 시작 시 R2에 backup 있으면 자동 복원, 이후 변경분 실시간 스트리밍
dbs:
  - path: /app/server/data/alba.db
    replicas:
      - type: s3
        endpoint: ${R2_ENDPOINT}
        bucket: ${R2_BUCKET}
        path: alba.db
        access-key-id: ${R2_ACCESS_KEY_ID}
        secret-access-key: ${R2_SECRET_ACCESS_KEY}
        region: auto
        force-path-style: true
        # WAL 누적 → R2 PUT 빈도 (R2 무료 티어 Class A 100만/월 안에서 안전)
        sync-interval: 10s
        # 24시간마다 스냅샷 → 복구 시 빠른 시작점
        snapshot-interval: 24h
        # 30일 보관 (그 이후 자동 삭제)
        retention: 720h
        retention-check-interval: 12h
